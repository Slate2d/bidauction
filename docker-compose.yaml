version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: bidstream_postgres
    environment:
      POSTGRES_USER: bidstream_user
      POSTGRES_PASSWORD: bidstream_password
      POSTGRES_DB: bidstream_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bidstream_user -d bidstream_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: